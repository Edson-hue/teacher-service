spring.application.name=teacher-service

server.port=${SERVER_PORT:9193}
spring.datasource.url=jdbc:${DB_CONNECTOR}://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:teacher-service}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Connect@123}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

eureka.instance.hostname= localhost
eureka.client.register-with-eureka= true
eureka.client.fetch-registry= true
eureka.client.service-url.defaultZone=http://localhost:6798/eureka/

#Actuator
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/schoolteacher